name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"      # weekly, so a newly published CVE in a dependency is noticed

# Least privilege for the workflow token: read the code, nothing else.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: python -m pip install --upgrade pip pip-audit bandit detect-secrets
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
      - name: Static analysis (medium severity and above)
        run: bandit -r riskengine scripts -ll -c pyproject.toml
      - name: No secrets committed
        run: |
          detect-secrets scan --exclude-files '^tests/' --exclude-lines 'a-long-random-secret' > ds.json
          python -c "import json,sys; r=json.load(open('ds.json'))['results']; print(json.dumps(r, indent=1)); sys.exit(1 if r else 0)"


  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fakeredis          # runs the Redis-backed state tests without a server

      - name: Tests
        run: pytest -q

      - name: Smoke-test the pipeline end to end
        run: |
          python scripts/make_mock_data.py --out mock.csv --n 60000
          python scripts/prepare_data.py --csv mock.csv --out prepared
          python scripts/train.py --data prepared --out models
          python scripts/pin_model.py --model models/latest.joblib
          python -c "
          from riskengine.modeling import RiskModel
          from riskengine.persist import verify_model
          verify_model('models/latest.joblib')
          m = RiskModel.load('models/latest.joblib')
          print('model', m.meta['version'], 'ok;', len(m.meta['features']), 'features')
          "

      - name: Production mode refuses an unconfigured start
        run: |
          python -c "
          import os
          os.environ.update(RISK_ENV='production', RISK_API_KEY='x'*32)
          from riskengine.api import create_app
          try:
              create_app('models/latest.joblib', '/tmp/s.json.gz', '/tmp/r.db')
          except RuntimeError as e:
              assert 'RISK_HASH_KEY' in str(e) and 'RISK_GEOIP_MODE' in str(e), e
              print('refused as expected')
          else:
              raise SystemExit('production mode started without its required settings')
          "

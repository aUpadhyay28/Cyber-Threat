[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskengine"
version = "0.5.0"
description = "Adaptive login risk engine: scores logins Low/Medium/High and learns from analyst-validated feedback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "pyarrow>=14,<27",
    "joblib>=1.3,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "httpx>=0.26,<1", "ruff>=0.5"]

[tool.setuptools]
packages = ["riskengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness rules, not house style: pyflakes (F), pycodestyle errors (E), likely-bug checks (B)
# and the pylint error subset. Import sorting and "modernise this syntax" suggestions are left out
# on purpose - they would rewrite most of the file for no behavioural gain.
select = ["F", "B", "PLE"]
# B905: zip(..., strict=) would be noise here; the zipped sequences are built together.
ignore = ["B905"]

[tool.bandit]
# B311: `random` is used only to generate demo and load-test traffic, never for anything secret.
skips = ["B311"]
